# A local database for checking demo changes in a browser without touching
# tally-demo's stores (DEMO.md, Local demo). Marked as the demo's by
# `DEMO_ENV=local npm run demo:mark -- localhost`, like the real one. Kept in a
# named volume: the Blob store beside it holds receipt images after a reset,
# so it cannot be marked again, and neither can a database emptied by a
# restart. Credentials are fixed local values; the port binds to localhost.
name: tally-demo-local

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
      POSTGRES_DB: tally_demo_local
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:55532:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tally -d tally_demo_local']
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  data:
